[package]
name = "expie"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
env_logger = "0.11.11"
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.3"
bytemuck = "1.25.2"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

rapier2d = { version = "0.36.1", features = ["debug-render"] }
glam = "0.33.12" # rapier2d

egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"

[profile.release]
debug = true